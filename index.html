<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paul's Gift Countdown</title>
<style>
  :root { --fg: #fff; --muted: #ece3d6; --accent: #ffc857; --card: rgb(0 0 0 / .5); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: #000; color: var(--fg); font-family: system-ui, sans-serif; text-align: center;
    text-shadow: 0 2px 10px rgb(0 0 0 / .8);
  }
  .bg, body::before { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* 180vw caps the crop on phones so the full "CEO OF" / "SEX" title (middle 52% of the photo) stays visible */
  .bg { z-index: -1; height: min(100%, 180vw); margin: auto; object-fit: cover; filter: brightness(.7); }
  /* on wide screens the whole square photo is shown; the blurred copy behind fills the gaps */
  @media (min-aspect-ratio: 1/1) { .bg { object-fit: contain; } }
  body::before { content: ""; z-index: -2; background: url(paul.webp) center / cover; filter: blur(24px) brightness(.35); transform: scale(1.1); }
  main { width: 100%; }
  h1 { font-size: clamp(1.8rem, 7vw, 3.5rem); margin: 0 0 .3em; }
  .when { display: inline-block; font-size: clamp(.8rem, 3.5vw, 1rem); color: var(--muted); margin: 0 0 2rem; padding: .3em .9em; border-radius: 999px; background: var(--card); backdrop-filter: blur(6px); }
  .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 2vw, 20px); max-width: 720px; margin: 0 auto; }
  .unit { background: var(--card); backdrop-filter: blur(6px); border: 1px solid rgb(255 255 255 / .15); border-radius: 16px; padding: clamp(12px, 3vw, 24px) 4px; }
  .unit b { display: block; font-size: clamp(1.8rem, 9vw, 4.5rem); font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
  .unit span { display: block; margin-top: .5em; font-size: clamp(.65rem, 2.5vw, 1rem); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .done { font-size: clamp(2rem, 8vw, 4rem); margin: 0; }
</style>
</head>
<body>
<img class="bg" src="paul.webp" alt="Paul in a leather jacket, arms crossed, under the title “CEO of Sex”">
<main>
  <h1>Paul's gift</h1>
  <p class="when">19 October 2027, 21:00 Central European time</p>
  <div class="timer" id="timer" role="timer">
    <div class="unit"><b id="days">–</b><span>days</span></div>
    <div class="unit"><b id="hours">–</b><span>hours</span></div>
    <div class="unit"><b id="minutes">–</b><span>minutes</span></div>
    <div class="unit"><b id="seconds">–</b><span>seconds</span></div>
  </div>
  <p class="done" id="done" hidden>🎉 It's party time!</p>
</main>
<script>
  // 21:00 on Central European clocks; summer time (CEST, UTC+2) runs until 31 Oct 2027.
  const target = new Date('2027-10-19T21:00:00+02:00');
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const left = Math.floor((target - Date.now()) / 1000);
    if (left <= 0) {
      $('timer').hidden = true;
      $('done').hidden = false;
      clearInterval(interval);
      return;
    }
    $('days').textContent = Math.floor(left / 86400);
    $('hours').textContent = pad(Math.floor(left / 3600) % 24);
    $('minutes').textContent = pad(Math.floor(left / 60) % 60);
    $('seconds').textContent = pad(left % 60);
  }
  const interval = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
