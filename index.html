<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paul's Birthday Countdown</title>
<style>
  :root { --bg: #fdf6ec; --fg: #2b2118; --muted: #7a6a5a; --accent: #d9482b; --card: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17130f; --fg: #f3e9dc; --muted: #a8998a; --accent: #ff7a59; --card: #241d17; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center;
  }
  .photo { display: block; width: min(100%, 420px); height: auto; margin: 0 auto 1.5rem; border-radius: 16px; box-shadow: 0 4px 20px rgb(0 0 0 / .25); }
  h1 { font-size: clamp(1.8rem, 7vw, 3.5rem); margin: 0 0 .3em; }
  .when { color: var(--muted); margin: 0 0 2rem; line-height: 1.5; }
  .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 2vw, 20px); max-width: 720px; margin: 0 auto; }
  .unit { background: var(--card); border-radius: 16px; padding: clamp(12px, 3vw, 24px) 4px; box-shadow: 0 2px 12px rgb(0 0 0 / .08); }
  .unit b { display: block; font-size: clamp(1.8rem, 9vw, 4.5rem); font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
  .unit span { display: block; margin-top: .5em; font-size: clamp(.65rem, 2.5vw, 1rem); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .done { font-size: clamp(2rem, 8vw, 4rem); margin: 0; }
</style>
</head>
<body>
<main>
  <img class="photo" src="paul.webp" width="1024" height="1024" alt="Paul in a leather jacket, arms crossed, under the title “CEO of Sex”">
  <h1>Paul's birthday</h1>
  <p class="when">19 October 2027, 21:00 Central European time<br><small id="local"></small></p>
  <div class="timer" id="timer" role="timer">
    <div class="unit"><b id="days">–</b><span>days</span></div>
    <div class="unit"><b id="hours">–</b><span>hours</span></div>
    <div class="unit"><b id="minutes">–</b><span>minutes</span></div>
    <div class="unit"><b id="seconds">–</b><span>seconds</span></div>
  </div>
  <p class="done" id="done" hidden>🎉 It's party time!</p>
</main>
<script>
  // 21:00 on Central European clocks; summer time (CEST, UTC+2) runs until 31 Oct 2027.
  const target = new Date('2027-10-19T21:00:00+02:00');
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  $('local').textContent = 'Your time: ' + target.toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' });

  function tick() {
    const left = Math.floor((target - Date.now()) / 1000);
    if (left <= 0) {
      $('timer').hidden = true;
      $('done').hidden = false;
      clearInterval(interval);
      return;
    }
    $('days').textContent = Math.floor(left / 86400);
    $('hours').textContent = pad(Math.floor(left / 3600) % 24);
    $('minutes').textContent = pad(Math.floor(left / 60) % 60);
    $('seconds').textContent = pad(left % 60);
  }
  const interval = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
